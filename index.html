<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水鱼博客状态监控</title>
<link rel="icon" href="https://blog.waterfish.ren/favicon.ico">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f5f7f9;color:#1a1a2e;min-height:100vh;line-height:1.6}
.container{max-width:960px;margin:0 auto;padding:24px 16px 40px}
#list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:640px){#list{grid-template-columns:1fr}}
.header{text-align:center;padding:20px 0}
.header .logo{width:56px;height:56px;border-radius:14px;overflow:hidden;margin:0 auto 12px;display:block}
.header h1{font-size:20px;font-weight:700;color:#1a1a2e}
.banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:12px;margin:16px 0;font-size:15px;font-weight:600}
.banner.ok{background:#e8f5e9;color:#2e7d32}
.banner.problem{background:#ffebee;color:#c62828}
.banner.loading{background:#e3f2fd;color:#1565c0}
.banner .icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.banner.ok .icon{background:#4caf50;color:#fff}
.banner.problem .icon{background:#ef5350;color:#fff}
.banner.loading .icon{background:#42a5f5;color:#fff}
.info-bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#888;padding:0 4px 12px}
.group-title{font-size:13px;font-weight:600;color:#666;margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.5px}
.monitor{background:#fff;border-radius:12px;padding:18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;min-height:100%}
.m-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.m-favicon{width:28px;height:28px;border-radius:6px;overflow:hidden;flex-shrink:0;background:#f0f0f0}
.m-favicon img{width:100%;height:100%;object-fit:cover}
.m-favicon .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px}
.m-name{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-status{font-size:12px;font-weight:600;padding:3px 12px;border-radius:20px;flex-shrink:0}
.m-status.ok{background:#e8f5e9;color:#2e7d32}
.m-status.down{background:#ffebee;color:#c62828}
.m-status.paused{background:#fff3e0;color:#e65100}
.m-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px}
.m-stat .label{font-size:11px;color:#999}
.m-stat .value{font-size:13px;font-weight:600;color:#333;margin-top:1px}
.m-stat .value .unit{font-size:11px;font-weight:400;color:#999;margin-left:2px}
.m-target{font-size:12px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-target a{color:#999;text-decoration:none}
.m-target a:hover{color:#1976d2}
.uptime-bar{display:flex;gap:2px;align-items:flex-end;margin-top:10px;height:28px}
.upt-day{flex:1;min-width:4px;border-radius:2px;height:100%;position:relative;cursor:pointer;transition:transform .1s}
.upt-day:hover{transform:scaleY(1.15);transform-origin:bottom}
.upt-day.up{background:#4caf50}
.upt-day.partial{background:#ffb300}
.upt-day.down{background:#ef5350}
.upt-day.nodata{background:#e0e0e0}
.upt-day .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:4px 8px;border-radius:6px;font-size:11px;white-space:nowrap;z-index:10;pointer-events:none}
.upt-day:hover .tip{display:block}
.footer{text-align:center;padding:24px 0 0;color:#bbb;font-size:12px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #e3f2fd;border-top-color:#42a5f5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center-msg{text-align:center;padding:40px;color:#999;font-size:14px;grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.err{color:#c62828}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img class="logo" src="https://blog.waterfish.ren/favicon.ico" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22><rect width=%2256%22 height=%2256%22 rx=%2214%22 fill=%22%234caf50%22/><text x=%2228%22 y=%2238%22 text-anchor=%22middle%22 font-size=%2228%22 fill=%22white%22>🐟</text></svg>'">
    <h1>水鱼博客状态监控</h1>
  </div>

  <div class="banner loading" id="banner">
    <span class="icon"><div class="spinner"></div></span>
    <span id="bannerText">正在获取数据...</span>
  </div>

  <div class="info-bar">
    <span>共 <b id="totalCount">0</b> 项服务</span>
    <span id="updatedAt"></span>
  </div>

  <div id="list">
    <div class="center-msg"><div class="spinner" style="margin-bottom:10px"></div>正在获取监控数据...</div>
  </div>

  <div class="footer">每 5 分钟自动刷新</div>
</div>

<script>
const FAVICON = 'https://blog.waterfish.ren/favicon.ico'
const GUGU_API = '/api/gugu?range=90d'
const UPTIME_API = '/api/uptime'
const MAX_POINTS = 30

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtMs(ms){if(ms==null||isNaN(ms))return '--';return ms>=1000?(ms/1000).toFixed(2)+'<span class="unit">s</span>':Math.round(ms)+'<span class="unit">ms</span>'}
function fmtPct(p){const n=Number(p);return (p==null||isNaN(n))?'--':n.toFixed(2)+'%'}
function daysLeft(validTo){if(!validTo)return null;const diff=new Date(validTo)-Date.now();return Math.max(0,Math.ceil(diff/86400000))}

function parseGugu(data){
  const comps=(data&&data.Data&&data.Data.components)||[]
  return comps.map(c=>{
    const healthy=c.status==='HEALTHY'||c.monitorStatus==='HEALTHY'
    let certDays=null
    ;(c.nodes||[]).forEach(n=>{
      try{const m=JSON.parse(n.message||'{}');if(m.sslCertificateValidTo)certDays=daysLeft(m.sslCertificateValidTo)}catch(e){}
    })
    const hist=c.history||[]
    const real=hist.filter(h=>h.totalChecks>0)
    const uptime=real.length? real.reduce((a,h)=>a+Number(h.uptimePercentage||0),0)/real.length : (c.uptimePercentage??null)
    const points=hist.slice(-MAX_POINTS).map(h=>{
      const has=h.totalChecks>0
      const isUp=h.uptimePercentage>0
      return {
        date:h.date,
        tip:h.date+' '+(has?('可用率 '+Number(h.uptimePercentage||0).toFixed(0)+'% · '+h.successCount+'成功/'+h.failureCount+'失败'):'无数据'),
        cls:has?(isUp?'up':'down'):'nodata'
      }
    })
    return {
      source:'咕咕监控',name:c.name||'未命名',target:c.target||'',
      status:healthy?'ok':'down',avgRt:c.responseTime,uptime,certDays,
      points,icon:c.faviconUrl||FAVICON
    }
  })
}

function parseUptime(data){
  const list=(data&&data.monitors)||[]
  return list.map((m)=>{
    const status=m.status===2?'ok':(m.status===0?'paused':'down')
    const rt=(m.response_times&&m.response_times.length)?m.response_times[0].value:null
    // UptimeRobot returns custom_uptime_ranges as a comma-separated string
    const rawRanges=m.custom_uptime_ranges
    let ranges=[]
    if(Array.isArray(rawRanges)) ranges=rawRanges.slice()
    else if(typeof rawRanges==='string'&&rawRanges) ranges=rawRanges.split(',')
    const real=ranges.filter(v=>v!=null).map(Number)
    let uptime=real.length? real.reduce((a,b)=>a+b,0)/real.length : null
    if(uptime==null && m.all_time_uptime_ratio!=null) uptime=Number(m.all_time_uptime_ratio)
    let points
    if(real.length){
      points=ranges.map((v,idx)=>{
        const date=new Date(Date.now()-(ranges.length-1-idx)*86400000).toISOString().slice(0,10)
        const ratio=v==null?null:Number(v)
        let cls='nodata',tip=date+' 无数据'
        if(ratio!=null){
          if(ratio>=100){cls='up';tip=date+' 可用率 100%'}
          else if(ratio>0){cls='partial';tip=date+' 可用率 '+ratio.toFixed(2)+'%'}
          else{cls='down';tip=date+' 可用率 0%（全部失败）'}
        }
        return {date,tip,cls}
      })
    } else {
      // fallback: derive dots from status-change logs (no per-day data available)
      points=(m.logs||[]).slice(0,60).map(l=>({
        date:l.datetime?new Date(l.datetime*1000).toISOString().slice(0,10):'',
        tip:(l.datetime?new Date(l.datetime*1000).toLocaleString('zh-CN'):'')+' · '+(l.type===2?'恢复正常':(l.type===1?'启动监控':'异常')),
        cls:l.type===2?'up':'down'
      }))
    }
    return {
      source:'UptimeRobot',name:m.friendly_name||('Uptime #'+m.id),target:m.url||'',
      status,avgRt:rt,uptime,certDays:null,points,icon:FAVICON
    }
  })
}

function renderMonitor(m){
  const stLabel={ok:'正常',down:'异常',paused:'已暂停'}[m.status]
  const iconHtml=m.icon
    ?'<div class="m-favicon"><img src="'+esc(m.icon)+'" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<span class=&quot;ph&quot;>🌐</span>\'"></div>'
    :'<div class="m-favicon"><span class="ph">🌐</span></div>'
  const certHtml=m.certDays!=null
    ?'<div class="m-stat"><div class="label">证书有效期</div><div class="value">'+m.certDays+'<span class="unit">天</span></div></div>'
    :''
  const targetHtml=m.target
    ?'<div class="m-target"><a href="'+esc(/^https?:\/\//.test(m.target)?m.target:'https://'+m.target)+'" target="_blank" rel="noopener">'+esc(m.target.replace(/^https?:\/\//,''))+'</a></div>'
    :''
  const ptsHtml=(m.points&&m.points.length)
    ?'<div class="uptime-bar">'+m.points.map(p=>'<span class="upt-day '+p.cls+'"><span class="tip">'+esc(p.tip)+'</span></span>').join('')+'</div>'
    :''
  return '<div class="monitor">'+
    '<div class="m-top">'+iconHtml+'<div class="m-name">'+esc(m.name)+'</div><span class="m-status '+m.status+'">'+stLabel+'</span></div>'+
    '<div class="m-stats">'+
      '<div class="m-stat"><div class="label">可用率</div><div class="value">'+fmtPct(m.uptime)+'</div></div>'+
      '<div class="m-stat"><div class="label">响应时间</div><div class="value">'+fmtMs(m.avgRt)+'</div></div>'+
      certHtml+
    '</div>'+
    targetHtml+
    ptsHtml+
  '</div>'
}

async function load(){
  const listEl=document.getElementById('list')
  const banner=document.getElementById('banner')
  const bText=document.getElementById('bannerText')
  let results=[]

  try{
    const [g,r]=await Promise.all([
      fetch(GUGU_API).then(r=>r.json()).catch(()=>null),
      fetch(UPTIME_API,{method:'POST'}).then(r=>r.json()).catch(()=>null)
    ])
    results=[...parseGugu(g),...parseUptime(r)]
  }catch(e){
    listEl.innerHTML='<div class="center-msg err">数据加载失败：'+esc(e.message||'')+'</div>'
    return
  }

  if(!results.length){
    listEl.innerHTML='<div class="center-msg err">未获取到任何监控数据<br><small>请检查 API 是否正常返回</small></div>'
    return
  }

  const okCount=results.filter(x=>x.status==='ok').length
  if(okCount===results.length){
    banner.className='banner ok';bText.innerHTML='所有服务运行正常'
  }else{
    banner.className='banner problem';bText.innerHTML='部分服务异常（'+okCount+'/'+results.length+' 正常）'
  }
  document.getElementById('totalCount').textContent=results.length
  document.getElementById('updatedAt').textContent=new Date().toLocaleString('zh-CN',{hour12:false})

  listEl.innerHTML=results.map(renderMonitor).join('')
}

load()
setInterval(load,5*60*1000)
</script>
</body>
</html>
